name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit + integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      # The system suite is deliberately excluded here: the cloning tests reach
      # out to github.com and the GUI/dashboard tests need a real Tk display, so
      # they are run locally. Everything they cover at unit and integration
      # level is exercised below.
      - name: Run unit and integration tests
        run: |
          python -m pytest test/unit_testing test/integration_testing \
            --cov --cov-branch --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: flake8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dev-requirements.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      # Syntax errors and undefined names fail the build; everything else is
      # reported but does not gate, since the baseline code predates this setup.
      - name: Fail on syntax errors and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Full report (non-blocking)
        run: flake8 . --count --max-line-length=120 --statistics --exit-zero
